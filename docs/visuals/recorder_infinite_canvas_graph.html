<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorder Subsystem — 2D Infinite Canvas Node-Link Graph</title>
  ${fontsStyle ? `<style id="archify-fonts">${fontsStyle}</style>` : ''}
  <style>
    :root {
      --bg-color: #060911;
      --grid-fine: #0e1626;
      --grid-major: #162238;
      
      --panel-bg: rgba(13, 20, 36, 0.92);
      --panel-border: #233554;
      --panel-border-bright: #38bdf8;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      
      --cyan: #38bdf8;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #f87171;
      --violet: #a78bfa;
      --indigo: #818cf8;
      --blue: #60a5fa;
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      user-select: none;
    }

    /* Fullscreen SVG Canvas */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      background-color: var(--bg-color);
    }
    #canvas-container.panning {
      cursor: grabbing;
    }
    svg.infinite-graph {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Floating HUD Top Bar */
    .hud-topbar {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .hud-topbar > * {
      pointer-events: auto;
    }

    .brand-pill {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7, #8b5cf6);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      font-family: var(--font-mono);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .brand-text h1 {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .hud-controls {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .hud-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      transform: translateY(-1px);
    }
    .hud-btn.primary {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .zoom-display {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      min-width: 48px;
      text-align: center;
    }

    /* Floating Navigation Controls (Bottom-Right Mini-Map) */
    .hud-bottomright {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }
    .hud-bottomright > * { pointer-events: auto; }

    .minimap-panel {
      width: 240px;
      height: 150px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }
    .minimap-title {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      pointer-events: none;
    }
    #minimap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Graph SVG Elements Styling */
    .grid-line-fine { stroke: var(--grid-fine); stroke-width: 1; }
    .grid-line-major { stroke: var(--grid-major); stroke-width: 1.5; }

    /* Container Swimlanes / Subgraphs */
    .subgraph-box {
      fill: rgba(15, 23, 42, 0.65);
      stroke: var(--panel-border);
      stroke-width: 1.5;
      rx: 16;
      ry: 16;
      transition: all 0.2s ease;
    }
    .subgraph-box.hovered {
      stroke: var(--cyan);
      fill: rgba(15, 23, 42, 0.8);
    }
    .subgraph-header-bg {
      fill: rgba(30, 41, 59, 0.85);
      rx: 14;
      ry: 14;
    }
    .subgraph-title {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.01em;
    }
    .subgraph-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
    }
    .subgraph-toggle-btn {
      cursor: pointer;
    }
    .subgraph-toggle-btn rect {
      fill: rgba(56, 189, 248, 0.15);
      stroke: var(--cyan);
      stroke-width: 1;
      rx: 6;
      ry: 6;
      transition: fill 0.15s ease;
    }
    .subgraph-toggle-btn:hover rect {
      fill: var(--cyan);
    }
    .subgraph-toggle-btn text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      fill: var(--cyan);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .subgraph-toggle-btn:hover text {
      fill: #060911;
    }

    /* Node Groups */
    .graph-node {
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .graph-node:hover {
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
    }
    .graph-node.selected rect,
    .graph-node.selected polygon {
      stroke: #38bdf8 !important;
      stroke-width: 2.5 !important;
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.8));
    }

    /* Action Rectangle Nodes */
    .node-rect {
      fill: #111827;
      stroke: #374151;
      stroke-width: 1.5;
      rx: 10;
      ry: 10;
    }
    .node-header-action { fill: #1f2937; rx: 8; ry: 8; }
    .node-text-title {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .node-text-code {
      font-family: var(--font-mono);
      font-size: 10.5px;
      fill: #94a3b8;
    }
    .node-text-src {
      font-family: var(--font-mono);
      font-size: 9.5px;
      fill: #64748b;
    }

    /* Decision Diamond Nodes */
    .diamond-polygon {
      fill: #1a1625;
      stroke: var(--amber);
      stroke-width: 2;
      transition: all 0.15s ease;
    }
    .diamond-text {
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 700;
      fill: #fbbf24;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .diamond-subtext {
      font-family: var(--font-mono);
      font-size: 9.5px;
      fill: #cbd5e1;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Loop Header Nodes */
    .loop-rect {
      fill: #1e1b4b;
      stroke: var(--violet);
      stroke-width: 2;
      rx: 24;
      ry: 24;
    }
    .loop-text {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      fill: #c4b5fd;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Data State Nodes (Hexagons/Badges along conduits) */
    .data-state-node polygon {
      fill: #0c1c2e;
      stroke: var(--cyan);
      stroke-width: 2;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
      transition: all 0.15s ease;
    }
    .data-state-node:hover polygon {
      fill: #112d4a;
      stroke: #7dd3fc;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.8));
    }
    .data-state-title {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 800;
      fill: #38bdf8;
      text-anchor: middle;
    }
    .data-state-desc {
      font-family: var(--font-mono);
      font-size: 10px;
      fill: #e2e8f0;
      text-anchor: middle;
    }

    /* Directed SVG Arrows / Connectors */
    .arrow-path {
      fill: none;
      stroke: #475569;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .arrow-path:hover {
      stroke: var(--cyan);
      stroke-width: 3;
    }
    .arrow-path.flow-main {
      stroke: #38bdf8;
      stroke-width: 2.5;
    }
    .arrow-path.branch-yes {
      stroke: #34d399;
      stroke-width: 2.2;
    }
    .arrow-path.branch-no {
      stroke: #f87171;
      stroke-width: 2.2;
    }
    .arrow-path.loop-back {
      stroke: #a78bfa;
      stroke-width: 2;
      stroke-dasharray: 6 5;
    }

    .branch-pill-yes text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      fill: #10b981;
    }
    .branch-pill-no text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      fill: #ef4444;
    }

    /* Side Detail Drawer */
    .drawer-scrim {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.65);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .drawer-scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(520px, 92vw);
      height: 100vh;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
      z-index: 250;
      transform: translateX(100%);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .detail-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      background: rgba(22, 34, 56, 0.6);
    }
    .drawer-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: inline-block;
      margin-bottom: 6px;
    }
    .drawer-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }
    .drawer-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: rgba(30, 41, 59, 0.6);
      color: var(--text-main);
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s ease;
    }
    .drawer-close:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .drawer-body {
      padding: 20px 22px 50px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .drawer-sec h6 {
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .drawer-sec p {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-main);
    }
    .code-snippet {
      background: #040711;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      color: #e2e8f0;
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(52, 211, 153, 0.12);
      color: var(--emerald);
      border: 1px solid rgba(52, 211, 153, 0.35);
      margin-right: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <!-- Canvas Viewport -->
  <div id="canvas-container">
    <svg id="svgCanvas" class="infinite-graph">
      <defs>
        <!-- Blueprint Grid Pattern -->
        <pattern id="grid-fine" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line-fine" />
        </pattern>
        <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
          <rect width="200" height="200" fill="url(#grid-fine)" />
          <path d="M 200 0 L 0 0 0 200" fill="none" class="grid-line-major" />
        </pattern>

        <!-- Directed Arrowheads -->
        <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
        </marker>
        <marker id="arrow-yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
        </marker>
        <marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
        </marker>
        <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
        </marker>
      </defs>

      <!-- Infinite Grid Background -->
      <rect id="grid-canvas" x="-5000" y="-5000" width="15000" height="15000" fill="url(#grid-major)" />

      <!-- Transformable Graph Layer -->
      <g id="world" transform="translate(60, 40) scale(0.65)">
        <!-- Layer for Directed Inter-Node Arrows -->
        <g id="edges-layer"></g>

        <!-- Layer for Subgraph Container Bounding Boxes -->
        <g id="containers-layer"></g>

        <!-- Layer for Micro-Nodes & Geometric Shapes -->
        <g id="nodes-layer"></g>

        <!-- Layer for Data Mutation Nodes -->
        <g id="data-states-layer"></g>
      </g>
    </svg>
  </div>

  <!-- HUD Top Controls -->
  <div class="hud-topbar">
    <div class="brand-pill">
      <div class="brand-icon">2D</div>
      <div class="brand-text">
        <h1>
          <span>Recorder Subsystem Infinite Graph</span>
          <span class="brand-badge">Node-Link Blueprint</span>
        </h1>
        <p>Interactive 2D Canvas • Expandable Compound Subgraphs • Pan &amp; Zoom</p>
      </div>
    </div>

    <div class="hud-controls">
      <button class="hud-btn" id="btnZoomIn" title="Zoom In (+)"><span>＋</span> Zoom In</button>
      <button class="hud-btn" id="btnZoomOut" title="Zoom Out (-)"><span>－</span> Zoom Out</button>
      <div class="zoom-display" id="zoomLevel">65%</div>
      <button class="hud-btn primary" id="btnFit" title="Fit Entire Graph to Screen"><span>⛶</span> Fit to Screen</button>
      <button class="hud-btn" id="btnExpandAll" title="Expand All 5 Subgraphs"><span>⊞</span> Expand All</button>
      <button class="hud-btn" id="btnCollapseAll" title="Collapse to 5 Macro Boxes"><span>⊟</span> Collapse All</button>
    </div>
  </div>

  <!-- HUD Bottom-Right Mini-Map -->
  <div class="hud-bottomright">
    <div class="minimap-panel" id="minimapContainer" title="Click or drag to pan canvas">
      <div class="minimap-title">Mini-Map</div>
      <canvas id="minimap-canvas" width="240" height="150"></canvas>
    </div>
  </div>

  <!-- Side Detail Drawer -->
  <div class="drawer-scrim" id="drawerScrim" onclick="closeDrawer()"></div>
  <aside class="detail-drawer" id="detailDrawer">
    <div class="drawer-header">
      <div>
        <span class="drawer-tag" id="drawerTag">NODE DETAIL</span>
        <h3 class="drawer-title" id="drawerTitle">Node Title</h3>
      </div>
      <button class="drawer-close" onclick="closeDrawer()">&times;</button>
    </div>
    <div class="drawer-body" id="drawerBody">
      <!-- Content populated dynamically -->
    </div>
  </aside>

  <!-- Canvas Engine & Graph Definition Script -->
  <script>
    // =========================================================================
    // GRAPH SPECIFICATION & METADATA DATABASE
    // =========================================================================
    const GRAPH_DATA = {
      stages: [
        {
          id: 'stage1',
          num: 1,
          title: 'Stage 1: Lifecycle & Thread Orchestration',
          subtitle: 'start() / stop() / wait()',
          badgeColor: '#38bdf8',
          thread: 'Main Thread',
          expanded: true,
          bounds: { x: 100, y: 100, w: 900, h: 580 },
          collapsedBounds: { x: 100, y: 100, w: 340, h: 140 },
          summary: 'Guards start() with atomic exchange, creates session directories, launches worker threads, and coordinates ordered zero-loss join shutdown.'
        },
        {
          id: 'stage2',
          num: 2,
          title: 'Stage 2: ZMQ Receiver Loop',
          subtitle: 'receiverLoop()',
          badgeColor: '#34d399',
          thread: 'Receiver Thread',
          expanded: true,
          bounds: { x: 100, y: 780, w: 900, h: 1240 },
          collapsedBounds: { x: 100, y: 780, w: 340, h: 140 },
          summary: 'Subscribes to ZMQ topics with 200ms recv timeout; captures UTC time; verifies SOP (0x0D0D) and EOP (0x0A0A); enqueues TelemetryMessage.'
        },
        {
          id: 'stage3',
          num: 3,
          title: 'Stage 3: Thread-Safe Memory Buffer',
          subtitle: 'BoundedByteQueue (push / drain)',
          badgeColor: '#fbbf24',
          thread: 'Producer / Consumer',
          expanded: true,
          bounds: { x: 1140, y: 780, w: 900, h: 1240 },
          collapsedBounds: { x: 1140, y: 780, w: 340, h: 140 },
          summary: 'Guards memory with 256 MB hard cap; drops without blocking receiver; transfers message batches in O(1) via std::swap under brief lock.'
        },
        {
          id: 'stage4',
          num: 4,
          title: 'Stage 4: Batch Consumer & 300s Segment Router',
          subtitle: 'writerLoop()',
          badgeColor: '#a78bfa',
          thread: 'Writer Thread',
          expanded: true,
          bounds: { x: 2180, y: 780, w: 940, h: 1240 },
          collapsedBounds: { x: 2180, y: 780, w: 340, h: 140 },
          summary: 'Drains batches every 50ms; calculates integer segment index seg_idx; executes multi-topic rollover; routes packets to per-topic TopicWriter.'
        },
        {
          id: 'stage5',
          num: 5,
          title: 'Stage 5: Lazy File & Binary Serializer',
          subtitle: 'TopicWriter & EndianCodec',
          badgeColor: '#f87171',
          thread: 'Libc Buffered I/O',
          expanded: true,
          bounds: { x: 3260, y: 780, w: 920, h: 1240 },
          collapsedBounds: { x: 3260, y: 780, w: 340, h: 140 },
          summary: 'Lazily creates .dat files only when first packet arrives (0 empty files); serializes 10B unpadded header; writes to 128KB _IOFBF buffer.'
        }
      ],

      // External Endpoints
      endpoints: [
        { id: 'ep_zmq', label: 'ZMQ Publisher Source', sub: 'tcp://192.168.5.21:30003', x: 100, y: 700, w: 240, h: 60, type: 'endpoint' },
        { id: 'ep_disk', label: 'Binary Disk Storage (.dat)', sub: 'zdata/<topic>/*.dat', x: 4260, y: 1540, w: 250, h: 70, type: 'endpoint' }
      ],

      // Data Mutation Nodes on Inter-Stage Conduits
      dataStates: [
        {
          id: 'DS1',

    const edgesLayer = document.getElementById('edges-layer');
    const nodesLayer = document.getElementById('nodes-layer');
    const dataStatesLayer = document.getElementById('data-states-layer');

    function getNodeCenter(nodeId) {
      // Check data states
      const ds = GRAPH_DATA.dataStates.find(d => d.id === nodeId);
      if (ds) return { x: ds.x + ds.w / 2, y: ds.y + ds.h / 2 };

      // Check endpoints
      const ep = GRAPH_DATA.endpoints.find(e => e.id === nodeId);
      if (ep) return { x: ep.x + ep.w / 2, y: ep.y + ep.h / 2 };

      // Check micro nodes
      const n = GRAPH_DATA.nodes.find(item => item.id === nodeId);
      if (!n) return null;

      const stage = GRAPH_DATA.stages.find(s => s.id === n.stage);
      if (!stage) return null;

      if (!stage.expanded) {
        // When stage is collapsed, link connects to the collapsed stage box center/ports
        return {
          x: stage.collapsedBounds.x + stage.collapsedBounds.w / 2,
          y: stage.collapsedBounds.y + stage.collapsedBounds.h / 2
        };
      }

      return {
        x: stage.bounds.x + n.relX + n.w / 2,
        y: stage.bounds.y + n.relY + n.h / 2
      };
    }

    function renderGraph() {
      // 1. Render Containers
      let containersHtml = '';
      GRAPH_DATA.stages.forEach(s => {
        const b = s.expanded ? s.bounds : s.collapsedBounds;
        const toggleText = s.expanded ? '－ Collapse' : '＋ Expand';

        containersHtml += `
          <g id="box_${s.id}" class="subgraph-group">
            <rect class="subgraph-box" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" />
            
            <!-- Header bar -->
            <rect class="subgraph-header-bg" x="${b.x + 8}" y="${b.y + 8}" width="${b.w - 16}" height="44" />
            <text class="subgraph-title" x="${b.x + 22}" y="${b.y + 35}">${s.title}</text>
            <text class="subgraph-badge" x="${b.x + b.w - 140}" y="${b.y + 34}" fill="${s.badgeColor}">${s.thread}</text>

            <!-- Toggle Button -->
            <g class="subgraph-toggle-btn" onclick="toggleStage('${s.id}')">
              <rect x="${b.x + b.w - 95}" y="${b.y + 16}" width="80" height="26" />
              <text x="${b.x + b.w - 55}" y="${b.y + 29}">${toggleText}</text>
            </g>
        `;

        if (!s.expanded) {
          // Render collapsed summary content
          containersHtml += `
            <text x="${b.x + 22}" y="${b.y + 80}" font-family="var(--font-mono)" font-size="11" fill="var(--text-muted)">${s.subtitle}</text>
            <text x="${b.x + 22}" y="${b.y + 105}" font-family="var(--font-sans)" font-size="11.5" fill="var(--text-faint)">Status: Collapsed Macro Node</text>
          `;
        }

        containersHtml += '</g>';
      });

      // Render Endpoints
      GRAPH_DATA.endpoints.forEach(ep => {
        containersHtml += `
          <g class="graph-node endpoint-node" onclick="showNodeDetail('${ep.id}')">
            <rect class="node-rect" x="${ep.x}" y="${ep.y}" width="${ep.w}" height="${ep.h}" stroke="var(--cyan)" />
            <text x="${ep.x + 14}" y="${ep.y + 26}" class="node-text-title">${ep.label}</text>
            <text x="${ep.x + 14}" y="${ep.y + 46}" class="node-text-code">${ep.sub}</text>
          </g>
        `;
      });
      containersLayer.innerHTML = containersHtml;

      // 2. Render Micro Nodes
      let nodesHtml = '';
      GRAPH_DATA.nodes.forEach(n => {
        const stage = GRAPH_DATA.stages.find(s => s.id === n.stage);
        if (!stage.expanded) return; // Hidden when collapsed

        const absX = stage.bounds.x + n.relX;
        const absY = stage.bounds.y + n.relY;

        if (n.type === 'action') {
          nodesHtml += `
            <g class="graph-node node-action" id="node_${n.id}" onclick="showNodeDetail('${n.id}')">
              <rect class="node-rect" x="${absX}" y="${absY}" width="${n.w}" height="${n.h}" />
              <rect class="node-header-action" x="${absX + 6}" y="${absY + 6}" width="${n.w - 12}" height="22" />
              <text class="node-text-title" x="${absX + 12}" y="${absY + 21}">${n.title}</text>
              <text class="node-text-code" x="${absX + 12}" y="${absY + 44}">${n.sub}</text>
            </g>
          `;
        } else if (n.type === 'diamond') {
          const cx = absX + n.w / 2;
          const cy = absY + n.h / 2;
          const rx = n.w / 2;
          const ry = n.h / 2;
          const pts = `${cx},${cy - ry} ${cx + rx},${cy} ${cx},${cy + ry} ${cx - rx},${cy}`;
          nodesHtml += `
            <g class="graph-node node-diamond" id="node_${n.id}" onclick="showNodeDetail('${n.id}')">
              <polygon class="diamond-polygon" points="${pts}" />
              <text class="diamond-text" x="${cx}" y="${cy - 6}">${n.title}</text>
              <text class="diamond-subtext" x="${cx}" y="${cy + 10}">${n.sub}</text>
            </g>
          `;
        } else if (n.type === 'loop') {
          nodesHtml += `
            <g class="graph-node node-loop" id="node_${n.id}" onclick="showNodeDetail('${n.id}')">
              <rect class="loop-rect" x="${absX}" y="${absY}" width="${n.w}" height="${n.h}" />
              <text class="loop-text" x="${absX + n.w / 2}" y="${absY + n.h / 2}">⟳ ${n.title}</text>
            </g>
          `;
        }
      });
      nodesLayer.innerHTML = nodesHtml;

      // 3. Render Data Mutation Hexagonal Nodes
      let dataHtml = '';
      GRAPH_DATA.dataStates.forEach(ds => {
        const cx = ds.x + ds.w / 2;
        const cy = ds.y + ds.h / 2;
        const rw = ds.w / 2;
        const rh = ds.h / 2;
        // Hexagonal cut points
        const cut = 14;
        const pts = `
          ${ds.x + cut},${ds.y} 
          ${ds.x + ds.w - cut},${ds.y} 
          ${ds.x + ds.w},${cy} 
          ${ds.x + ds.w - cut},${ds.y + ds.h} 
          ${ds.x + cut},${ds.y + ds.h} 
          ${ds.x},${cy}
        `.replace(/\s+/g, ' ');

        dataHtml += `
          <g class="graph-node data-state-node" id="ds_${ds.id}" onclick="showNodeDetail('${ds.id}')">
            <polygon points="${pts}" />
            <text class="data-state-title" x="${cx}" y="${cy - 5}">${ds.title}</text>
            <text class="data-state-desc" x="${cx}" y="${cy + 11}">${ds.desc}</text>
          </g>
        `;
      });
      dataStatesLayer.innerHTML = dataHtml;

      // 4. Render Edges with Bezier Curves & Arrowheads
      let edgesHtml = '';
      GRAPH_DATA.edges.forEach(e => {
        const fromPt = getNodeCenter(e.from);
        const toPt = getNodeCenter(e.to);
        if (!fromPt || !toPt) return;

        // Determine if both nodes are visible or inside collapsed container
        const fromNode = GRAPH_DATA.nodes.find(n => n.id === e.from);
        const toNode = GRAPH_DATA.nodes.find(n => n.id === e.to);
        const fromStage = fromNode ? GRAPH_DATA.stages.find(s => s.id === fromNode.stage) : null;
        const toStage = toNode ? GRAPH_DATA.stages.find(s => s.id === toNode.stage) : null;

        // Skip internal edge if stage is collapsed
        if (fromStage && toStage && fromStage.id === toStage.id && !fromStage.expanded) {
          return;
        }

        let marker = 'url(#arrow-default)';
        let cls = 'arrow-path';
        if (e.type === 'main') { marker = 'url(#arrow-main)'; cls += ' flow-main'; }
        else if (e.type === 'yes') { marker = 'url(#arrow-yes)'; cls += ' branch-yes'; }
        else if (e.type === 'no') { marker = 'url(#arrow-no)'; cls += ' branch-no'; }
        else if (e.type === 'loop') { marker = 'url(#arrow-loop)'; cls += ' loop-back'; }

        // Compute path string
        let pathD = '';
        const dx = toPt.x - fromPt.x;
        const dy = toPt.y - fromPt.y;

        if (e.type === 'loop') {
          // Curved loop back path
          const midX = Math.min(fromPt.x, toPt.x) - 130;
          pathD = `M ${fromPt.x} ${fromPt.y} C ${midX} ${fromPt.y}, ${midX} ${toPt.y}, ${toPt.x} ${toPt.y}`;
        } else if (Math.abs(dx) > Math.abs(dy)) {
          // Horizontal flow curve
          const cx1 = fromPt.x + dx * 0.45;
          const cx2 = toPt.x - dx * 0.45;
          pathD = `M ${fromPt.x} ${fromPt.y} C ${cx1} ${fromPt.y}, ${cx2} ${toPt.y}, ${toPt.x} ${toPt.y}`;
        } else {
          // Vertical flow curve
          const cy1 = fromPt.y + dy * 0.45;
          const cy2 = toPt.y - dy * 0.45;
          pathD = `M ${fromPt.x} ${fromPt.y} C ${fromPt.x} ${cy1}, ${toPt.x} ${cy2}, ${toPt.x} ${toPt.y}`;
        }

        edgesHtml += `<path d="${pathD}" class="${cls}" marker-end="${marker}" />`;

        // Add YES/NO branch labels
        if (e.label) {
          const midX = (fromPt.x + toPt.x) / 2;
          const midY = (fromPt.y + toPt.y) / 2 - 8;
          const labelCls = e.type === 'yes' ? 'branch-pill-yes' : (e.type === 'no' ? 'branch-pill-no' : '');
          edgesHtml += `
            <g class="${labelCls}">
              <text x="${midX}" y="${midY}" text-anchor="middle">${e.label}</text>
            </g>
          `;
        }
      });
      edgesLayer.innerHTML = edgesHtml;

      // Update Mini-Map
      updateMiniMap();
    }

    // Toggle container expansion
    function toggleStage(stageId) {
      const stage = GRAPH_DATA.stages.find(s => s.id === stageId);
      if (stage) {
        stage.expanded = !stage.expanded;
        renderGraph();
      }
    }

    // Expand All
    document.getElementById('btnExpandAll').addEventListener('click', () => {
      GRAPH_DATA.stages.forEach(s => s.expanded = true);
      renderGraph();
    });

    // Collapse All
    document.getElementById('btnCollapseAll').addEventListener('click', () => {
      GRAPH_DATA.stages.forEach(s => s.expanded = false);
      renderGraph();
    });

    // =========================================================================
    // INFINITE CANVAS PAN & ZOOM ENGINE
    // =========================================================================
    let scale = 0.65;
    let panX = 60;
    let panY = 40;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    const container = document.getElementById('canvas-container');
    const zoomLevelEl = document.getElementById('zoomLevel');

    function applyTransform() {
      scale = Math.min(Math.max(scale, 0.18), 3.0);
      worldG.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
      zoomLevelEl.textContent = Math.round(scale * 100) + '%';
      updateMiniMap();
    }

    // Mouse Pan
    container.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hud-topbar, .hud-bottomright, .detail-drawer')) return;
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      container.classList.add('panning');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('pointerup', () => {
      isPanning = false;
      container.classList.remove('panning');
    });

    // Mouse Wheel Zoom centered at cursor
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const worldX = (mouseX - panX) / scale;
      const worldY = (mouseY - panY) / scale;

      const newScale = Math.min(Math.max(scale * zoomFactor, 0.18), 3.0);
      panX = mouseX - worldX * newScale;
      panY = mouseY - worldY * newScale;
      scale = newScale;

      applyTransform();
    }, { passive: false });

    // HUD Zoom Buttons
    document.getElementById('btnZoomIn').addEventListener('click', () => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const wx = (cx - panX) / scale;
      const wy = (cy - panY) / scale;
      scale *= 1.25;
      panX = cx - wx * scale;
      panY = cy - wy * scale;
      applyTransform();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const wx = (cx - panX) / scale;
      const wy = (cy - panY) / scale;
      scale *= 0.8;
      panX = cx - wx * scale;
      panY = cy - wy * scale;
      applyTransform();
    });

    // Fit to Screen
    function fitToScreen() {
      // Calculate bounding box of all stages
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      GRAPH_DATA.stages.forEach(s => {
        const b = s.expanded ? s.bounds : s.collapsedBounds;
        minX = Math.min(minX, b.x);
        minY = Math.min(minY, b.y);
        maxX = Math.max(maxX, b.x + b.w);
        maxY = Math.max(maxY, b.y + b.h);
      });
      GRAPH_DATA.endpoints.forEach(ep => {
        minX = Math.min(minX, ep.x);
        minY = Math.min(minY, ep.y);
        maxX = Math.max(maxX, ep.x + ep.w);
        maxY = Math.max(maxY, ep.y + ep.h);
      });

      const pad = 80;
      const graphW = (maxX - minX) + pad * 2;
      const graphH = (maxY - minY) + pad * 2;

      const winW = window.innerWidth;
      const winH = window.innerHeight;

      scale = Math.min(winW / graphW, winH / graphH, 1.2);
      panX = (winW - (minX + maxX) * scale) / 2;
      panY = (winH - (minY + maxY) * scale) / 2;
      applyTransform();
    }
    document.getElementById('btnFit').addEventListener('click', fitToScreen);

    // =========================================================================
    // MINI-MAP ENGINE
    // =========================================================================
    const minimapCanvas = document.getElementById('minimap-canvas');
    const miniCtx = minimapCanvas.getContext('2d');

    function updateMiniMap() {
      const mw = minimapCanvas.width;
      const mh = minimapCanvas.height;
      miniCtx.clearRect(0, 0, mw, mh);

      // World bounds mapping (0,0 to 4600, 2400)
      const worldW = 4600;
      const worldH = 2400;
      const mx = mw / worldW;
      const my = mh / worldH;

      // Draw background
      miniCtx.fillStyle = '#080d19';
      miniCtx.fillRect(0, 0, mw, mh);

      // Draw Subgraphs
      GRAPH_DATA.stages.forEach(s => {
        const b = s.expanded ? s.bounds : s.collapsedBounds;
        miniCtx.fillStyle = s.badgeColor + '33';
        miniCtx.strokeStyle = s.badgeColor;
        miniCtx.lineWidth = 1;
        miniCtx.fillRect(b.x * mx, b.y * my, b.w * mx, b.h * my);
        miniCtx.strokeRect(b.x * mx, b.y * my, b.w * mx, b.h * my);
      });

      // Draw Data State Nodes
      GRAPH_DATA.dataStates.forEach(ds => {
        miniCtx.fillStyle = '#38bdf8';
        miniCtx.fillRect(ds.x * mx, ds.y * my, ds.w * mx, ds.h * my);
      });

      // Draw Visible Viewport Rectangle
      const vx = (-panX / scale);
      const vy = (-panY / scale);
      const vw = (window.innerWidth / scale);
      const vh = (window.innerHeight / scale);

      miniCtx.strokeStyle = '#38bdf8';
      miniCtx.lineWidth = 2;
      miniCtx.fillStyle = 'rgba(56, 189, 248, 0.15)';
      miniCtx.fillRect(vx * mx, vy * my, vw * mx, vh * my);
      miniCtx.strokeRect(vx * mx, vy * my, vw * mx, vh * my);
    }

    // Mini-map click to pan
    document.getElementById('minimapContainer').addEventListener('pointerdown', (e) => {
      const rect = minimapCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const worldW = 4600;
      const worldH = 2400;
      const targetWX = (clickX / rect.width) * worldW;
      const targetWY = (clickY / rect.height) * worldH;

      panX = window.innerWidth / 2 - targetWX * scale;
      panY = window.innerHeight / 2 - targetWY * scale;
      applyTransform();
    });

    // =========================================================================
    // SIDE DETAIL DRAWER LOGIC
    // =========================================================================
    const drawer = document.getElementById('detailDrawer');
    const drawerScrim = document.getElementById('drawerScrim');
    const drawerTag = document.getElementById('drawerTag');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerBody = document.getElementById('drawerBody');

    function showNodeDetail(nodeId) {
      // Find node detail
      let data = NODE_DETAILS_MAP[nodeId];
      if (!data) {
        const ds = GRAPH_DATA.dataStates.find(d => d.id === nodeId);
        if (ds) data = ds.detail;
      }
      if (!data) {
        const ep = GRAPH_DATA.endpoints.find(e => e.id === nodeId);
        if (ep) {
          data = {
            title: ep.label,
            tag: 'ENDPOINT',
            source: ep.sub,
            explain: 'Network or disk storage endpoint.',
            code: ep.sub
          };
        }
      }
      if (!data) return;

      // Highlight selected node
      document.querySelectorAll('.graph-node').forEach(el => el.classList.remove('selected'));
      const activeEl = document.getElementById('node_' + nodeId) || document.getElementById('ds_' + nodeId);
      if (activeEl) activeEl.classList.add('selected');

      drawerTag.textContent = data.tag;
      drawerTitle.textContent = data.title;
      drawerBody.innerHTML = `
        <div class="drawer-sec">
          <h6>Architectural Function &amp; Purpose</h6>
          <p>${data.explain}</p>
        </div>
        <div class="drawer-sec">
          <h6>Source Code Reference</h6>
          <span class="source-badge">📄 ${data.source}</span>
        </div>
        <div class="drawer-sec">
          <h6>Implementation / Byte Layout Details</h6>
          <pre class="code-snippet">${data.code}</pre>
        </div>
      `;

      drawer.classList.add('open');
      drawerScrim.classList.add('open');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      drawerScrim.classList.remove('open');
      document.querySelectorAll('.graph-node').forEach(el => el.classList.remove('selected'));
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });

    // Initialize graph rendering
    renderGraph();
    fitToScreen();
  </script>
</body>
</html>
