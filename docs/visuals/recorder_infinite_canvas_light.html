  <style>
    :root {
      --bg-color: #f1f5f9;
      --grid-fine: #e2e8f0;
      --grid-major: #cbd5e1;
      
      --panel-bg: rgba(255, 255, 255, 0.96);
      --panel-border: #94a3b8;
      --panel-border-bright: #0284c7;
      
      --text-main: #0f172a;
      --text-muted: #334155;
      --text-faint: #64748b;
      
      --cyan: #0284c7;
      --cyan-light: #e0f2fe;
      --emerald: #16a34a;
      --emerald-light: #dcfce7;
      --amber: #d97706;
      --amber-light: #fef3c7;
      --rose: #e11d48;
      --rose-light: #ffe4e6;
      --violet: #7c3aed;
      --violet-light: #f3e8ff;
      --blue: #2563eb;
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      user-select: none;
    }

    /* Fullscreen SVG Canvas */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      background-color: var(--bg-color);
    }
    #canvas-container.panning {
      cursor: grabbing;
    }
    svg.infinite-graph {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Floating HUD Top Bar */
    .hud-topbar {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .hud-topbar > * {
      pointer-events: auto;
    }

    .brand-pill {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.1);
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      font-family: var(--font-mono);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }
    .brand-text h1 {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 7px;
      border-radius: 4px;
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      font-weight: 700;
    }
    .brand-badge.theme-badge {
      background: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .hud-controls {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.1);
    }
    .hud-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: #f0f9ff;
      border-color: var(--cyan);
      color: var(--cyan);
      transform: translateY(-1px);
    }
    .hud-btn.primary {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }
    .hud-btn.primary:hover {
      background: #bae6fd;
    }
    .zoom-display {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      min-width: 48px;
      text-align: center;
    }

    /* Floating Navigation Controls (Bottom-Right Mini-Map) */
    .hud-bottomright {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }
    .hud-bottomright > * { pointer-events: auto; }

    .minimap-panel {
      width: 250px;
      height: 150px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      position: relative;
      cursor: crosshair;
    }
    .minimap-title {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      pointer-events: none;
    }
    #minimap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Graph SVG Elements Styling */
    .grid-line-fine { stroke: var(--grid-fine); stroke-width: 1; }
    .grid-line-major { stroke: var(--grid-major); stroke-width: 1.5; }

    /* Container Swimlanes / Subgraphs */
    .subgraph-box {
      fill: #f8fafc;
      stroke: #94a3b8;
      stroke-width: 1.8;
      rx: 16;
      ry: 16;
      filter: drop-shadow(0 4px 16px rgba(15, 23, 42, 0.06));
      transition: all 0.2s ease;
    }
    .subgraph-box.hovered {
      stroke: var(--cyan);
      filter: drop-shadow(0 6px 20px rgba(2, 132, 199, 0.18));
    }
    .subgraph-header-bg {
      rx: 12;
      ry: 12;
    }
    #box_stage1 .subgraph-header-bg { fill: #e0f2fe; }
    #box_stage2 .subgraph-header-bg { fill: #dcfce7; }
    #box_stage3 .subgraph-header-bg { fill: #fef3c7; }
    #box_stage4 .subgraph-header-bg { fill: #f3e8ff; }
    #box_stage5 .subgraph-header-bg { fill: #ffe4e6; }

    #box_stage1 .subgraph-title { fill: #0369a1; }
    #box_stage2 .subgraph-title { fill: #15803d; }
    #box_stage3 .subgraph-title { fill: #b45309; }
    #box_stage4 .subgraph-title { fill: #6b21a8; }
    #box_stage5 .subgraph-title { fill: #be123c; }

    .subgraph-title {
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .subgraph-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
    }
    .subgraph-toggle-btn {
      cursor: pointer;
    }
    .subgraph-toggle-btn rect {
      fill: #ffffff;
      stroke: #94a3b8;
      stroke-width: 1.2;
      rx: 6;
      ry: 6;
      transition: all 0.15s ease;
    }
    .subgraph-toggle-btn:hover rect {
      fill: #0284c7;
      stroke: #0284c7;
    }
    .subgraph-toggle-btn text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      fill: #334155;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .subgraph-toggle-btn:hover text {
      fill: #ffffff;
    }

    /* Node Groups */
    .graph-node {
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .graph-node:hover {
      filter: drop-shadow(0 4px 14px rgba(2, 132, 199, 0.3));
    }
    .graph-node.selected .node-rect,
    .graph-node.selected .diamond-polygon,
    .graph-node.selected .loop-rect,
    .graph-node.selected polygon {
      stroke: #0284c7 !important;
      stroke-width: 2.8 !important;
      filter: drop-shadow(0 4px 16px rgba(2, 132, 199, 0.45));
    }

    /* Action Rectangle Nodes (Clear crisp borders, divider line, 3 lines of content) */
    .node-rect {
      fill: #ffffff;
      stroke: #475569;
      stroke-width: 1.8;
      rx: 10;
      ry: 10;
      filter: drop-shadow(0 2px 8px rgba(15, 23, 42, 0.08));
    }
    .node-header-action {
      fill: #f1f5f9;
      rx: 8;
      ry: 8;
    }
    .node-divider {
      stroke: #cbd5e1;
      stroke-width: 1.2;
    }
    .node-text-title {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      fill: #0f172a;
    }
    .node-text-code {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      fill: #0369a1;
    }
    .node-text-src {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      fill: #64748b;
    }

    /* Decision Diamond Nodes (Sharp borders, warm high-contrast text) */
    .diamond-polygon {
      fill: #fffbeb;
      stroke: #b45309;
      stroke-width: 2.2;
      filter: drop-shadow(0 3px 8px rgba(180, 83, 9, 0.18));
      transition: all 0.15s ease;
    }

      text-anchor: middle;

      font-size: 9.5px;
      font-weight: 700;
      fill: #b45309;
      text-anchor: middle;
      dominant-baseline: central;

      font-size: 11.5px;
      font-weight: 700;
      fill: #4c1d95;
      text-anchor: middle;
      dominant-baseline: central;

      stroke: #0284c7;
      stroke-width: 2.4;

      font-size: 9.5px;
      font-weight: 600;
      fill: #0284c7;
      text-anchor: middle;

      stroke: #475569;

      stroke-linecap: round;

      stroke: #0284c7;
      stroke-width: 3.2;

      stroke-width: 2.6;

      stroke-width: 2.4;

    .arrow-path.branch-no {
      stroke: #dc2626;
      stroke-width: 2.4;
    }

      stroke: #7c3aed;
      stroke-width: 2.2;
      stroke-dasharray: 6 5;

      fill: #ffffff;
      stroke-width: 1.6;

    .drawer-scrim {

      flex-direction: column;

    }

      font-weight: 700;
      color: #0f172a;

      height: 32px;

      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s ease;

      border-color: var(--cyan);
      color: var(--cyan);
      background: #f0f9ff;
    }

      padding: 20px 22px 50px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

      line-height: 1.6;
      color: #334155;
    }

      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;

      font-family: var(--font-mono);

      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;

      color: #15803d;

    // =========================================================================

    // =========================================================================
    const worldG = document.getElementById('world');
    const containersLayer = document.getElementById('containers-layer');
    const edgesLayer = document.getElementById('edges-layer');
    const nodesLayer = document.getElementById('nodes-layer');
    const dataStatesLayer = document.getElementById('data-states-layer');

    function getNodeBox(nodeId) {
      const ds = GRAPH_DATA.dataStates.find(d => d.id === nodeId);
      if (ds) return { x: ds.x, y: ds.y, w: ds.w, h: ds.h, cx: ds.x + ds.w / 2, cy: ds.y + ds.h / 2 };

      const ep = GRAPH_DATA.endpoints.find(e => e.id === nodeId);
      if (ep) return { x: ep.x, y: ep.y, w: ep.w, h: ep.h, cx: ep.x + ep.w / 2, cy: ep.y + ep.h / 2 };

      const n = GRAPH_DATA.nodes.find(item => item.id === nodeId);
      if (!n) return null;

      const stage = GRAPH_DATA.stages.find(s => s.id === n.stage);
      if (!stage) return null;

      if (!stage.expanded) {
        const b = stage.collapsedBounds;
        return { x: b.x, y: b.y, w: b.w, h: b.h, cx: b.x + b.w / 2, cy: b.y + b.h / 2 };
      }

      const x = stage.bounds.x + n.relX;
      const y = stage.bounds.y + n.relY;
      return { x, y, w: n.w, h: n.h, cx: x + n.w / 2, cy: y + n.h / 2 };
    }

    function getConnectorPorts(boxA, boxB, edgeType) {
      const dx = boxB.cx - boxA.cx;
      const dy = boxB.cy - boxA.cy;

      if (edgeType === 'loop') {
        return {
          from: { x: boxA.x, y: boxA.cy, side: 'left' },
          to: { x: boxB.x, y: boxB.cy, side: 'left' }
        };
      }

      // Horizontal dominant connection
      if (dx > 0 && Math.abs(dx) >= Math.abs(dy) * 0.75) {
        return {
          from: { x: boxA.x + boxA.w, y: boxA.cy, side: 'right' },
          to: { x: boxB.x, y: boxB.cy, side: 'left' }
        };
      }
      if (dx < 0 && Math.abs(dx) >= Math.abs(dy) * 0.75) {
        return {
          from: { x: boxA.x, y: boxA.cy, side: 'left' },
          to: { x: boxB.x + boxB.w, y: boxB.cy, side: 'right' }
        };
      }

      // Vertical dominant connection
      if (dy > 0) {
        return {
          from: { x: boxA.cx, y: boxA.y + boxA.h, side: 'bottom' },
          to: { x: boxB.cx, y: boxB.y, side: 'top' }
        };
      } else {
        return {
          from: { x: boxA.cx, y: boxA.y, side: 'top' },
          to: { x: boxB.cx, y: boxB.y + boxB.h, side: 'bottom' }
        };
      }
    }

    function renderGraph() {
      // 1. Render Containers (Bottom layer in world group)
      let containersHtml = '';
      GRAPH_DATA.stages.forEach(s => {
        const b = s.expanded ? s.bounds : s.collapsedBounds;
        const toggleText = s.expanded ? '－ Collapse' : '＋ Expand';

        containersHtml += `
          <g id="box_${s.id}" class="subgraph-group">
            <rect class="subgraph-box" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" />
            
            <!-- Header bar -->
            <rect class="subgraph-header-bg" x="${b.x + 8}" y="${b.y + 8}" width="${b.w - 16}" height="44" />
        `;

        if (s.expanded) {
          containersHtml += `
            <text class="subgraph-title" x="${b.x + 22}" y="${b.y + 35}">${s.title}</text>
            <text class="subgraph-badge" x="${b.x + b.w - 210}" y="${b.y + 34}" fill="${s.badgeColor}">${s.thread}</text>
            <g class="subgraph-toggle-btn" onclick="toggleStage('${s.id}')">
              <rect x="${b.x + b.w - 100}" y="${b.y + 16}" width="84" height="26" />

            </g>
          `;
        } else {
          containersHtml += `
            <text class="subgraph-title" x="${b.x + 18}" y="${b.y + 34}" font-size="13">${s.shortTitle || s.title}</text>
            <text class="subgraph-badge" x="${b.x + b.w - 180}" y="${b.y + 34}" fill="${s.badgeColor}">${s.thread}</text>
            <g class="subgraph-toggle-btn" onclick="toggleStage('${s.id}')">
              <rect x="${b.x + b.w - 95}" y="${b.y + 16}" width="80" height="26" />
              <text x="${b.x + b.w - 55}" y="${b.y + 29}">${toggleText}</text>
            </g>
            <text x="${b.x + 20}" y="${b.y + 80}" font-family="var(--font-mono)" font-size="11" fill="var(--text-muted)">${s.subtitle}</text>
            <text x="${b.x + 20}" y="${b.y + 106}" font-family="var(--font-sans)" font-size="11.5" fill="var(--text-faint)">Status: Collapsed Macro Box (Click 'Expand' to inspect)</text>
          `;
        }

        containersHtml += '</g>';
      });

      // Render Endpoints
      GRAPH_DATA.endpoints.forEach(ep => {
        containersHtml += `
          <g class="graph-node endpoint-node" onclick="showNodeDetail('${ep.id}')">
            <rect class="node-rect" x="${ep.x}" y="${ep.y}" width="${ep.w}" height="${ep.h}" stroke="var(--cyan)" />
            <rect class="node-header-action" x="${ep.x + 2}" y="${ep.y + 2}" width="${ep.w - 4}" height="26" />
            <line class="node-divider" x1="${ep.x}" y1="${ep.y + 28}" x2="${ep.x + ep.w}" y2="${ep.y + 28}" />
            <text x="${ep.x + 14}" y="${ep.y + 19}" class="node-text-title">${ep.label}</text>
            <text x="${ep.x + 14}" y="${ep.y + 48}" class="node-text-code">${ep.sub}</text>
          </g>
        `;
      });
      containersLayer.innerHTML = containersHtml;

      // 2. Render Micro Nodes (Action cards with crisp borders, divider line & 3 text rows)
      let nodesHtml = '';
      GRAPH_DATA.nodes.forEach(n => {
        const stage = GRAPH_DATA.stages.find(s => s.id === n.stage);
        if (!stage.expanded) return;

        const absX = stage.bounds.x + n.relX;
        const absY = stage.bounds.y + n.relY;

        if (n.type === 'action') {
          nodesHtml += `
            <g class="graph-node node-action" id="node_${n.id}" onclick="showNodeDetail('${n.id}')">
              <rect class="node-rect" x="${absX}" y="${absY}" width="${n.w}" height="${n.h}" />
              <rect class="node-header-action" x="${absX + 2}" y="${absY + 2}" width="${n.w - 4}" height="26" rx="8" />
              <line class="node-divider" x1="${absX}" y1="${absY + 28}" x2="${absX + n.w}" y2="${absY + 28}" />
              <text class="node-text-title" x="${absX + 12}" y="${absY + 19}">${n.title}</text>
              <text class="node-text-code" x="${absX + 12}" y="${absY + 47}">${n.sub}</text>
              <text class="node-text-src" x="${absX + 12}" y="${absY + 67}">📄 ${n.src || ''}</text>
            </g>
          `;
        } else if (n.type === 'diamond') {
          const cx = absX + n.w / 2;
          const cy = absY + n.h / 2;
          const rx = n.w / 2;
          const ry = n.h / 2;
          const pts = `${cx},${cy - ry} ${cx + rx},${cy} ${cx},${cy + ry} ${cx - rx},${cy}`;
          nodesHtml += `
            <g class="graph-node node-diamond" id="node_${n.id}" onclick="showNodeDetail('${n.id}')">
              <polygon class="diamond-polygon" points="${pts}" />
              <text class="diamond-text" x="${cx}" y="${cy - 8}">${n.title}</text>
              <text class="diamond-subtext" x="${cx}" y="${cy + 12}">${n.sub}</text>
            </g>
          `;
        } else if (n.type === 'loop') {
          nodesHtml += `
            <g class="graph-node node-loop" id="node_${n.id}" onclick="showNodeDetail('${n.id}')">
              <rect class="loop-rect" x="${absX}" y="${absY}" width="${n.w}" height="${n.h}" />
              <text class="loop-text" x="${absX + n.w / 2}" y="${absY + n.h / 2}">⟳ ${n.title}</text>
            </g>
          `;
        }
      });
      nodesLayer.innerHTML = nodesHtml;

      // 3. Render Data Mutation Hexagonal Nodes
      let dataHtml = '';
      GRAPH_DATA.dataStates.forEach(ds => {
        const cx = ds.x + ds.w / 2;
        const cy = ds.y + ds.h / 2;
        const cut = 16;
        const pts = `
          ${ds.x + cut},${ds.y} 
          ${ds.x + ds.w - cut},${ds.y} 
          ${ds.x + ds.w},${cy} 
          ${ds.x + ds.w - cut},${ds.y + ds.h} 
          ${ds.x + cut},${ds.y + ds.h} 
          ${ds.x},${cy}
        `.replace(/\s+/g, ' ');

        dataHtml += `
          <g class="graph-node data-state-node" id="ds_${ds.id}" onclick="showNodeDetail('${ds.id}')">
            <polygon points="${pts}" />
            <text class="data-state-title" x="${cx}" y="${cy - 6}">${ds.title}</text>
            <text class="data-state-desc" x="${cx}" y="${cy + 12}">${ds.desc}</text>
          </g>
        `;
      });
      dataStatesLayer.innerHTML = dataHtml;

      // 4. Render Edges (Drawn on top of containers, docking directly to card borders)
      let edgesHtml = '';
      GRAPH_DATA.edges.forEach(e => {
        const boxFrom = getNodeBox(e.from);
        const boxTo = getNodeBox(e.to);
        if (!boxFrom || !boxTo) return;

        const fromNode = GRAPH_DATA.nodes.find(n => n.id === e.from);
        const toNode = GRAPH_DATA.nodes.find(n => n.id === e.to);
        const fromStage = fromNode ? GRAPH_DATA.stages.find(s => s.id === fromNode.stage) : null;
        const toStage = toNode ? GRAPH_DATA.stages.find(s => s.id === toNode.stage) : null;

        // Skip internal edge if stage is collapsed
        if (fromStage && toStage && fromStage.id === toStage.id && !fromStage.expanded) {
          return;
        }

        const ports = getConnectorPorts(boxFrom, boxTo, e.type);

        let marker = 'url(#arrow-default)';
        let cls = 'arrow-path';
        if (e.type === 'main') { marker = 'url(#arrow-main)'; cls += ' flow-main'; }
        else if (e.type === 'yes') { marker = 'url(#arrow-yes)'; cls += ' branch-yes'; }
        else if (e.type === 'no') { marker = 'url(#arrow-no)'; cls += ' branch-no'; }
        else if (e.type === 'loop') { marker = 'url(#arrow-loop)'; cls += ' loop-back'; }

        // Compute smooth curve path between perimeter docking ports
        let pathD = '';
        if (ports.from.side === 'left' && ports.to.side === 'left') {
          const minX = Math.min(ports.from.x, ports.to.x) - 120;
          pathD = `M ${ports.from.x} ${ports.from.y} C ${minX} ${ports.from.y}, ${minX} ${ports.to.y}, ${ports.to.x} ${ports.to.y}`;
        } else if (ports.from.side === 'right' && ports.to.side === 'left') {
          const dx = ports.to.x - ports.from.x;
          const cx1 = ports.from.x + dx * 0.5;
          const cx2 = ports.to.x - dx * 0.5;
          pathD = `M ${ports.from.x} ${ports.from.y} C ${cx1} ${ports.from.y}, ${cx2} ${ports.to.y}, ${ports.to.x} ${ports.to.y}`;
        } else if (ports.from.side === 'left' && ports.to.side === 'right') {
          const dx = ports.to.x - ports.from.x;
          const cx1 = ports.from.x + dx * 0.5;
          const cx2 = ports.to.x - dx * 0.5;
          pathD = `M ${ports.from.x} ${ports.from.y} C ${cx1} ${ports.from.y}, ${cx2} ${ports.to.y}, ${ports.to.x} ${ports.to.y}`;
        } else {
          const dy = ports.to.y - ports.from.y;
          const cy1 = ports.from.y + dy * 0.5;
          const cy2 = ports.to.y - dy * 0.5;
          pathD = `M ${ports.from.x} ${ports.from.y} C ${ports.from.x} ${cy1}, ${ports.to.x} ${cy2}, ${ports.to.x} ${ports.to.y}`;
        }

        edgesHtml += `<path d="${pathD}" class="${cls}" marker-end="${marker}" />`;

        // Add YES/NO branch labels with opaque pill background
        if (e.label) {
          let midX = (ports.from.x + ports.to.x) / 2;
          let midY = (ports.from.y + ports.to.y) / 2;
          if (ports.from.side === 'left' && ports.to.side === 'left') {
            midX = Math.min(ports.from.x, ports.to.x) - 120;
          }

          const labelText = e.label;
          const labelWidth = Math.max(labelText.length * 7.5 + 18, 54);
          const labelHeight = 22;
          const isYes = e.type === 'yes';
          const isNo = e.type === 'no';
          const pillStroke = isYes ? '#16a34a' : (isNo ? '#dc2626' : '#475569');
          const pillText = isYes ? '#15803d' : (isNo ? '#b91c1c' : '#0f172a');

          edgesHtml += `
            <g class="branch-pill-group">
              <rect class="branch-pill-bg" x="${midX - labelWidth / 2}" y="${midY - labelHeight / 2}" width="${labelWidth}" height="${labelHeight}" rx="5" stroke="${pillStroke}" />
              <text x="${midX}" y="${midY + 4}" text-anchor="middle" font-family="var(--font-mono)" font-size="10px" font-weight="800" fill="${pillText}">${labelText}</text>
            </g>
          `;
        }
      });
      edgesLayer.innerHTML = edgesHtml;

      // Update Mini-Map
      updateMiniMap();
    }

    // Toggle container expansion
    function toggleStage(stageId) {
      const stage = GRAPH_DATA.stages.find(s => s.id === stageId);
      if (stage) {
        stage.expanded = !stage.expanded;
        renderGraph();
      }
    }

    // Expand All
    document.getElementById('btnExpandAll').addEventListener('click', () => {
      GRAPH_DATA.stages.forEach(s => s.expanded = true);
      renderGraph();
    });

    // Collapse All
    document.getElementById('btnCollapseAll').addEventListener('click', () => {
      GRAPH_DATA.stages.forEach(s => s.expanded = false);
      renderGraph();
    });

    // =========================================================================
    // INFINITE CANVAS PAN & ZOOM ENGINE
    // =========================================================================
    let scale = 0.58;
    let panX = 40;
    let panY = 30;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    const container = document.getElementById('canvas-container');
    const zoomLevelEl = document.getElementById('zoomLevel');

    function applyTransform() {
      scale = Math.min(Math.max(scale, 0.16), 3.0);
      worldG.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
      zoomLevelEl.textContent = Math.round(scale * 100) + '%';
      updateMiniMap();
    }

    // Mouse Pan
    container.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hud-topbar, .hud-bottomright, .detail-drawer')) return;
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      container.classList.add('panning');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('pointerup', () => {
      isPanning = false;
      container.classList.remove('panning');
    });

    // Mouse Wheel Zoom centered at cursor
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const worldX = (mouseX - panX) / scale;
      const worldY = (mouseY - panY) / scale;

      const newScale = Math.min(Math.max(scale * zoomFactor, 0.16), 3.0);
      panX = mouseX - worldX * newScale;
      panY = mouseY - worldY * newScale;
      scale = newScale;

      applyTransform();
    }, { passive: false });

    // HUD Zoom Buttons
    document.getElementById('btnZoomIn').addEventListener('click', () => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const wx = (cx - panX) / scale;
      const wy = (cy - panY) / scale;
      scale *= 1.25;
      panX = cx - wx * scale;
      panY = cy - wy * scale;
      applyTransform();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const wx = (cx - panX) / scale;
      const wy = (cy - panY) / scale;
      scale *= 0.8;
      panX = cx - wx * scale;
      panY = cy - wy * scale;
      applyTransform();
    });

    // Fit to Screen
    function fitToScreen() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      GRAPH_DATA.stages.forEach(s => {
        const b = s.expanded ? s.bounds : s.collapsedBounds;
        minX = Math.min(minX, b.x);
        minY = Math.min(minY, b.y);
        maxX = Math.max(maxX, b.x + b.w);
        maxY = Math.max(maxY, b.y + b.h);
      });
      GRAPH_DATA.endpoints.forEach(ep => {
        minX = Math.min(minX, ep.x);
        minY = Math.min(minY, ep.y);
        maxX = Math.max(maxX, ep.x + ep.w);
        maxY = Math.max(maxY, ep.y + ep.h);
      });

      const pad = 90;
      const graphW = (maxX - minX) + pad * 2;
      const graphH = (maxY - minY) + pad * 2;

      const winW = window.innerWidth;
      const winH = window.innerHeight;

      scale = Math.min(winW / graphW, winH / graphH, 1.1);
      panX = (winW - (minX + maxX) * scale) / 2;
      panY = (winH - (minY + maxY) * scale) / 2;
      applyTransform();
    }
    document.getElementById('btnFit').addEventListener('click', fitToScreen);

    // =========================================================================
    // MINI-MAP ENGINE (Light Theme)
    // =========================================================================
    const minimapCanvas = document.getElementById('minimap-canvas');
    const miniCtx = minimapCanvas.getContext('2d');

    function updateMiniMap() {
      const mw = minimapCanvas.width;
      const mh = minimapCanvas.height;
      miniCtx.clearRect(0, 0, mw, mh);

      const worldW = 5900;
      const worldH = 2400;
      const mx = mw / worldW;
      const my = mh / worldH;

      // Draw light background
      miniCtx.fillStyle = '#f8fafc';
      miniCtx.fillRect(0, 0, mw, mh);

      // Draw Subgraphs
      GRAPH_DATA.stages.forEach(s => {
        const b = s.expanded ? s.bounds : s.collapsedBounds;
        miniCtx.fillStyle = s.badgeColor + '20';
        miniCtx.strokeStyle = s.badgeColor;
        miniCtx.lineWidth = 1;
        miniCtx.fillRect(b.x * mx, b.y * my, b.w * mx, b.h * my);
        miniCtx.strokeRect(b.x * mx, b.y * my, b.w * mx, b.h * my);
      });

      // Draw Data State Nodes
      GRAPH_DATA.dataStates.forEach(ds => {
        miniCtx.fillStyle = '#0284c7';
        miniCtx.fillRect(ds.x * mx, ds.y * my, ds.w * mx, ds.h * my);
      });

      // Draw Visible Viewport Rectangle
      const vx = (-panX / scale);
      const vy = (-panY / scale);
      const vw = (window.innerWidth / scale);
      const vh = (window.innerHeight / scale);

      miniCtx.strokeStyle = '#0284c7';
      miniCtx.lineWidth = 2;
      miniCtx.fillStyle = 'rgba(2, 132, 199, 0.12)';
      miniCtx.fillRect(vx * mx, vy * my, vw * mx, vh * my);
      miniCtx.strokeRect(vx * mx, vy * my, vw * mx, vh * my);
    }

    // Mini-map click to pan
    document.getElementById('minimapContainer').addEventListener('pointerdown', (e) => {
      const rect = minimapCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const worldW = 5900;
      const worldH = 2400;
      const targetWX = (clickX / rect.width) * worldW;
      const targetWY = (clickY / rect.height) * worldH;

      panX = window.innerWidth / 2 - targetWX * scale;
      panY = window.innerHeight / 2 - targetWY * scale;
      applyTransform();
    });

    // =========================================================================
    // SIDE DETAIL DRAWER LOGIC
    // =========================================================================
    const drawer = document.getElementById('detailDrawer');
    const drawerScrim = document.getElementById('drawerScrim');
    const drawerTag = document.getElementById('drawerTag');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerBody = document.getElementById('drawerBody');

    function showNodeDetail(nodeId) {
      let data = NODE_DETAILS_MAP[nodeId];
      if (!data) {
        const ds = GRAPH_DATA.dataStates.find(d => d.id === nodeId);
        if (ds) data = ds.detail;
      }
      if (!data) {
        const ep = GRAPH_DATA.endpoints.find(e => e.id === nodeId);
        if (ep) {
          data = {
            title: ep.label,
            tag: 'ENDPOINT',
            source: ep.sub,
            explain: 'Network or disk storage endpoint.',
            code: ep.sub
          };
        }
      }
      if (!data) return;

      document.querySelectorAll('.graph-node').forEach(el => el.classList.remove('selected'));
      const activeEl = document.getElementById('node_' + nodeId) || document.getElementById('ds_' + nodeId);
      if (activeEl) activeEl.classList.add('selected');

      drawerTag.textContent = data.tag;
      drawerTitle.textContent = data.title;
      drawerBody.innerHTML = `
        <div class="drawer-sec">
          <h6>Architectural Function &amp; Purpose</h6>
          <p>${data.explain}</p>
        </div>
        <div class="drawer-sec">
          <h6>Source Code Reference</h6>
          <span class="source-badge">📄 ${data.source}</span>
        </div>
        <div class="drawer-sec">
          <h6>Implementation / Byte Layout Details</h6>
          <pre class="code-snippet">${data.code}</pre>
        </div>
      `;

      drawer.classList.add('open');
      drawerScrim.classList.add('open');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      drawerScrim.classList.remove('open');
      document.querySelectorAll('.graph-node').forEach(el => el.classList.remove('selected'));
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });

    // Initialize graph rendering
    renderGraph();
    fitToScreen();
  </script>
</body>
</html>
